name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    # ADDON releases only. There are two independent version numbers and therefore two tag
    # namespaces, but only one of them is a push trigger:
    #   addons-v1.2.3  the CLIENT ADDONS — clients/addons.manifest.json sdkVersion; publishes the
    #                  addon archives, ADDONS.json and the npm CLI. Handled by the `addons` job below.
    #   v1.2.3         the PLATFORM — KnockBox.Server.csproj <Version>. Owned entirely by
    #                  release.yml, which is manual-only and DERIVES the tag from the csproj.
    # `v*` deliberately is NOT listed. It used to be, and a hand-pushed tag was then a second path to
    # a platform release — one that bypassed every guard release.yml adds (version-matches-assembly,
    # tag-not-reused, :latest-never-moves-backwards, and the build-everything-before-pushing-anything
    # gate). Two paths to one artifact drift, and the unguarded one wins by being easier to reach.
    # Re-adding it would also be silent: a tag pushed by release.yml with GITHUB_TOKEN does not
    # trigger further workflow runs, so the duplicate publish only fires when you tag by hand.
    # ReleaseWorkflowTests asserts it stays absent.
    tags: ['addons-v*']
  pull_request:
    branches: [main]

# Least-privilege default for GITHUB_TOKEN. The `gate` job below needs nothing more; the two
# publishing jobs each grant themselves what they need at job level, and nothing else can.
permissions:
  contents: read

jobs:
  # The whole build-and-test suite — six jobs, defined in gate.yml so release.yml verifies the exact
  # same thing rather than a second copy of it. They appear nested under this job in the run view.
  gate:
    name: Suite
    uses: ./.github/workflows/gate.yml

  # ── Pre-release channel ──────────────────────────────────────────────────────────────────────────
  # `:develop` ONLY. Versioned/`:latest` tags are release.yml's, and deliberately not reachable from
  # here: this job publishes whatever main happens to be, which is exactly what a release must not be.
  publish:
    name: Publish :develop to GHCR
    runs-on: ubuntu-latest
    # Only publish green commits: one `needs:` on the whole suite, which fails or is skipped as a unit.
    needs: [gate]
    # main only. Never on a PR, a feature branch or an addons-v* tag — those run the suite but produce
    # no image. release.yml cannot reach this job at all: it calls gate.yml directly, not this file.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Serialize publishes for a given ref so two quick main pushes can't race on the :develop tag.
    # cancel-in-progress: false — never abort a push mid-flight; let it finish, then run the next.
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write   # push images to GHCR with the built-in GITHUB_TOKEN — no extra secrets
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One tag: :develop. metadata-action is kept for the labels (and because it lowercases the image
      # name — jcub1011/KnockBox-Games → ghcr.io/jcub1011/knockbox-games).
      #
      # The `type=semver` lines and `flavor: latest=auto` used to live here and are gone on purpose.
      # latest=auto only ever saw the current ref, never the registry, so re-running an OLDER v* tag
      # silently moved :latest backward — a caveat this file carried for as long as it had the feature.
      # release.yml computes those tags itself and compares against every existing v* tag, so
      # "is this actually the newest?" is answered rather than assumed.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=develop
          flavor: latest=false

      # Reuses the gha cache gate.yml's `docker` job warmed (that job is inside the suite this one
      # `needs`, and the cache is scoped per branch, not per workflow file), so the pushed image is a
      # cache-hit rebuild of the exact layers that were just smoke-tested — not a
      # fresh, unvalidated build. Single-platform (linux-x64/amd64) matches the Dockerfile's
      # `-r linux-x64` AOT publish — no QEMU/multi-arch needed — and the cache makes the slow AOT
      # compile a no-op on the common path.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: KnockBox.Server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Addon release ────────────────────────────────────────────────────────────────────────────────
  # Publishes the client addons: one archive per addon attached to the GitHub release, an ADDONS.json
  # index committed to main, and the CLI to npm.
  #
  # The index is the trust root for every `knockbox addon` install — download URLs are DERIVED from
  # repo/tag/asset, never carried in the index, so the sha256 recorded here is the only thing that
  # attests to the bytes. It is therefore generated from the archives that were just built, never
  # hand-maintained: a stale hash fails every install with a tampering error that is not tampering.
  # This job runs `npm publish` and MUST stay in this file. The npm trusted publisher on npmjs.com
  # names the publishing workflow by FILENAME, and both OIDC claims it can be matched against
  # (`workflow_ref`, `job_workflow_ref`) resolve to whichever file the job is DEFINED in. Moving it —
  # into gate.yml, or into an addons-release.yml of its own — breaks `npm publish` with an auth error
  # until that config is edited by hand. It is also why the suite was extracted rather than these two
  # jobs; see the note at the top of gate.yml.
  addons:
    name: Publish addons + CLI
    runs-on: ubuntu-latest
    # Same gate as the image publish: only green commits ship.
    needs: [gate]
    # `addons-v*` tags only. Unlike the image (which also publishes :develop from main), an addon
    # release is a version a game repo will pin, so there is no "latest from main" equivalent.
    #
    # The `publish` job needs no matching exclusion: its condition is refs/heads/main, which no tag
    # ref matches, so an addon release correctly leaves the image alone.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/addons-v')
    concurrency:
      group: addons-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write    # upload release assets + commit the regenerated index
      id-token: write    # npm trusted publishing (OIDC) — no long-lived NPM_TOKEN in this repo
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main      # the index is committed to main, not to the detached tag
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # The tag must agree with the manifest, or the index would advertise a version whose archives
      # were built from different sources. AddonManifestTests already ties every version FILE to the
      # manifest; this ties the RELEASE to it.
      - name: Tag matches the manifest's sdkVersion
        run: |
          declared="$(node -p "require('./clients/addons.manifest.json').sdkVersion")"
          tag="${GITHUB_REF_NAME#addons-v}"
          if [ "$declared" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies $tag but clients/addons.manifest.json declares $declared."                  "Bump the manifest and re-tag — a mismatch would publish an index nobody can install from."
            exit 1
          fi

      - name: Build archives + index
        run: node tools/build-addons.mjs --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"

      # Pushing a tag does not create a Release, and `gh release upload` requires one to exist — so
      # create it if it isn't already there (it may be, if the release notes were drafted in the UI
      # first). --clobber so re-running the job replaces assets instead of erroring on a duplicate.
      - name: Attach archives to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME"             --title "Client addons $GITHUB_REF_NAME"             --notes "KnockBox client addons. Install with \`npx knockbox addon add <godot|phaser|web>\`, from the Godot Asset Library, or by unzipping an archive below at your project root. See docs/ADDONS.md."
          gh release upload "$GITHUB_REF_NAME" .addons/*.zip --clobber

      # Committed rather than served off the release: `knockbox addon` reads one stable URL, and the
      # index has to carry the older releases too so a pinned `--version` stays installable.
      - name: Commit the index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .addons/ADDONS.json
          if git diff --cached --quiet; then
            echo "index unchanged — nothing to commit"
          else
            git commit -m "Publish addon index for $GITHUB_REF_NAME"
            git push origin HEAD:main
          fi

      # Trusted publishing needs npm >= 11.5.1 (and Node >= 22.14.0). setup-node's bundled npm is
      # normally new enough, but the publish is the one step where "normally" is not good enough: a
      # too-old npm fails with an auth error rather than a version error, which reads as a misconfigured
      # trusted publisher and sends you looking in the wrong place entirely.
      - name: Ensure an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      # The repo copy holds the 0.0.0-dev sentinel so there is no second version number to keep in
      # step with the manifest; npm needs a real one, so it is stamped here from the same manifest the
      # archives were built from. Not committed — the sentinel stays the committed value.
      #
      # No --provenance: with trusted publishing npm generates and publishes provenance attestations
      # automatically, and no NODE_AUTH_TOKEN either — the OIDC token from `id-token: write` is the
      # credential. The trusted publisher on npmjs.com names this workflow by FILENAME, so renaming
      # ci.yml breaks publishing until the publisher config is updated to match.
      - name: Publish the CLI to npm
        working-directory: tools/pack-game
        run: |
          version="$(node -p "require('../../clients/addons.manifest.json').sdkVersion")"
          npm version "$version" --no-git-tag-version --allow-same-version
          npm ci
          npm publish --access public
