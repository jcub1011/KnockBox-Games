name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    # Release tags (v1.2.3) re-run the suite on the tagged commit and trigger the publish job.
    tags: ['v*']
  pull_request:
    branches: [main]

# Least-privilege default for GITHUB_TOKEN: the test/build jobs only check out and build/test, so
# read-only contents is sufficient. The lone exception is the `publish` job, which grants itself
# `packages: write` at job level (below) to push images to GHCR — nothing else can write packages.
permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test KnockBox-Games.slnx --nologo

  aot:
    name: Native AOT publish (warnings gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      # Native AOT compiles to a native object and links it via clang against zlib; the SDK doesn't
      # ship the toolchain (mirrors the Dockerfile's build stage).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      # The full ILC compile is the only thing that surfaces trim/AOT (ILxxxx) warnings; /warnaserror
      # fails the build on any new one, so the app stays AOT-clean as code and dependencies change.
      - run: dotnet publish KnockBox.Server -r linux-x64 -c Release /warnaserror

  web:
    name: Web (shell + SDK) tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test

  clients-phaser:
    name: Phaser client tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/phaser
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/phaser/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  pack-game:
    name: pack-game tool tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/pack-game
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/pack-game/package-lock.json
      - run: npm ci
      - run: npm test

  docker:
    name: Docker image build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # Needed by the .kbg smoke test below, which builds a package with the real packer. Pinned for
      # the same reason as the other Node jobs rather than relying on the runner's default version.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/pack-game/package-lock.json

      # Build via buildx so the layers land in the gha cache that the publish job reuses — the
      # published image is then a cache-hit rebuild of these exact, smoke-tested layers, not a
      # separate build. `load` puts the image in the local daemon so the `docker run` smoke test
      # below can use the `knockbox:ci` tag.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: KnockBox.Server/Dockerfile
          load: true
          tags: knockbox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container with an empty mounted games dir
        run: |
          mkdir -p /tmp/kb-games
          docker run -d --name kb \
            -p 8080:8080 -p 8081:8081 -p 8082:8082 \
            -v /tmp/kb-games:/games:ro \
            -e KnockBox__GamesPollSeconds=2 \
            knockbox:ci

      - name: Shell serves from the baked-in web root
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8080/ | grep -qi '<html'
          curl -fsS http://localhost:8080/shell.js >/dev/null
          curl -fsS http://localhost:8081/knockbox.js >/dev/null

      # The admin portal is a THIRD origin, and the only thing that makes it reachable is its port being
      # listed in the image's ASPNETCORE_HTTP_PORTS — an explicit port list REPLACES the built-in defaults
      # in Program.cs rather than adding to them. It once shipped routed-but-never-bound, answering
      # "connection refused" while the startup log claimed it was up, so assert the socket end to end here:
      # unit tests can only cover the routing predicates, never whether Kestrel actually bound the port.
      - name: Admin portal is reachable on its own origin, and only there
        run: |
          curl -fsS http://localhost:8082/ | grep -qi '<html'
          curl -fsS http://localhost:8082/admin.js >/dev/null
          curl -fsS http://localhost:8082/admin.css >/dev/null
          # Unclaimed on a fresh container: no password set yet, nobody authenticated.
          curl -fsS http://localhost:8082/admin/api/auth/status | grep -q '"configured":false'
          curl -fsS http://localhost:8082/admin/api/auth/status | grep -q '"authenticated":false'
          # Privileged data needs a session — an unauthenticated poll must be refused, not served.
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8082/admin/api/system/status)" = "401" ]
          # ...and the portal must be invisible from the two PUBLIC origins, which players can reach.
          ! curl -fsS http://localhost:8080/admin/ >/dev/null
          ! curl -fsS http://localhost:8080/admin/admin.js >/dev/null
          ! curl -fsS http://localhost:8080/admin/api/auth/status >/dev/null
          ! curl -fsS http://localhost:8081/admin/ >/dev/null

      - name: Admin password can be set, and only once
        run: |
          # A password under the minimum must be refused BEFORE the portal is claimed — otherwise the
          # first hurried password (this is claim-on-first-use) could be trivially weak.
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"password":"short"}' http://localhost:8082/admin/api/auth/setup)" = "400" ]
          curl -fsS http://localhost:8082/admin/api/auth/status | grep -q '"configured":false'
          # The claim-on-first-use setup path, plus the session cookie it issues. Also pins that the
          # password lands on the /app/data volume rather than the root-owned image dir: if that write
          # failed the response would carry success:false and this step would catch it.
          curl -fsS -c /tmp/kb-admin-cookies -X POST -H 'Content-Type: application/json' \
            -d '{"password":"ci-admin-password"}' \
            http://localhost:8082/admin/api/auth/setup | grep -q '"success":true'
          grep -q kb_admin_session /tmp/kb-admin-cookies
          docker exec kb test -f /app/data/admin.secret
          # The stored hash must not be world-readable: anyone with a shell in the container (or on a
          # bind-mounted host path) could otherwise copy it and crack it offline at their leisure.
          [ "$(docker exec kb stat -c '%a' /app/data/admin.secret)" = "600" ]
          # Now claimed, so a second setup attempt must be refused — otherwise anyone could re-claim it.
          # 409, distinct from the 400 above, so the portal can tell "reset it" from "pick a better one".
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"password":"attacker-password"}' http://localhost:8082/admin/api/auth/setup)" = "409" ]
          # A wrong password is rejected; the right one authenticates and unlocks the dashboard data.
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"password":"wrong-password"}' http://localhost:8082/admin/api/auth/login)" = "401" ]
          curl -fsS -b /tmp/kb-admin-cookies http://localhost:8082/admin/api/system/status \
            | grep -q '"uptime"'

      - name: Admin password attempts are rate-limited
        run: |
          # Each attempt costs a 600k-iteration PBKDF2 (~0.4s of a core), so an unthrottled endpoint is an
          # unauthenticated CPU-exhaustion lever as much as a guessing oracle. The default allowance is 10
          # per minute per IP; this loop must therefore start returning 429 well before it finishes.
          # (The container has already spent part of the budget on the step above, so 429 comes quickly.)
          got429=0
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
              -d "{\"password\":\"guess-number-$i\"}" http://localhost:8082/admin/api/auth/login)
            if [ "$code" = "429" ]; then got429=1; break; fi
          done
          [ "$got429" = "1" ] || { echo "Login was never throttled — the PBKDF2 DoS lever is open."; exit 1; }
          docker logs kb 2>&1 | grep -q "Throttled an admin password attempt"
          # A throttled attempt must be refused, not silently allowed: the correct password must still be
          # rejected with 429 while the bucket is empty.
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"password":"ci-admin-password"}' http://localhost:8082/admin/api/auth/login)" = "429" ]
          # ...and the throttle must not break the already-authenticated dashboard poll.
          curl -fsS -b /tmp/kb-admin-cookies http://localhost:8082/admin/api/system/status | grep -q '"uptime"'

      - name: Hot drop-in — game appears via the polling fallback
        run: |
          cp -r games/tictactoe /tmp/kb-games/
          for i in $(seq 1 30); do
            # Fail fast (with logs) if the container died, instead of spinning the full 30s.
            [ "$(docker inspect -f '{{.State.Running}}' kb 2>/dev/null)" = "true" ] \
              || { echo "Container is not running:"; docker logs kb 2>&1; exit 1; }
            docker logs kb 2>&1 | grep -q "Discovered game 'tictactoe'" && break
            sleep 1
          done
          docker logs kb 2>&1 | grep "Discovered game 'tictactoe'"
          # ...and its assets serve from the game origin.
          curl -fsS http://localhost:8081/games/tictactoe/GAME.json >/dev/null
          curl -fsS http://localhost:8081/games/tictactoe/index.html >/dev/null

      - name: Server-authority module is never served from the game origin
        run: |
          # tictactoe-server declares serverAuthority: authority.js — server-side code (and for
          # hidden-information games, secret). Its client assets serve; the module (and any
          # precompressed variant of it) must 404 even on the game origin.
          cp -r games/tictactoe-server /tmp/kb-games/
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Running}}' kb 2>/dev/null)" = "true" ] \
              || { echo "Container is not running:"; docker logs kb 2>&1; exit 1; }
            docker logs kb 2>&1 | grep -q "Discovered game 'tictactoe-server'" && break
            sleep 1
          done
          docker logs kb 2>&1 | grep "Discovered game 'tictactoe-server'"
          curl -fsS http://localhost:8081/games/tictactoe-server/index.html >/dev/null
          curl -fsS http://localhost:8081/games/tictactoe-server/game.js >/dev/null
          ! curl -fsS http://localhost:8081/games/tictactoe-server/authority.js >/dev/null
          ! curl -fsS http://localhost:8081/games/tictactoe-server/authority.js.br >/dev/null

      - name: authorityWords dictionaries are never served from the game origin
        run: |
          # A game declaring authorityWords ships shared, server-side dictionaries (and for
          # hidden-information word games, secret ones). Its client assets serve; the word file (and
          # any precompressed variant) must 404 on the game origin, like the authority module.
          # The game is synthesized here from tictactoe-server rather than committed: the only thing
          # under test is the manifest declaration, and games/ is otherwise gitignored build output.
          mkdir -p /tmp/wordsrc && cp -r games/tictactoe-server/. /tmp/wordsrc/
          printf 'apple\nbrave\ncrane\n' > /tmp/wordsrc/words.txt
          printf '%s' '{ "id": "word-gate", "name": "Word Gate", "entry": "index.html",
            "thumbnail": "thumb.svg", "maxPlayers": 2, "serverAuthority": "authority.js",
            "authorityWords": { "en": { "file": "words.txt", "caseInsensitive": true } } }' \
            > /tmp/wordsrc/GAME.json
          mkdir -p /tmp/kb-games/word-gate && cp -r /tmp/wordsrc/. /tmp/kb-games/word-gate/
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Running}}' kb 2>/dev/null)" = "true" ] \
              || { echo "Container is not running:"; docker logs kb 2>&1; exit 1; }
            docker logs kb 2>&1 | grep -q "Discovered game 'word-gate'" && break
            sleep 1
          done
          docker logs kb 2>&1 | grep "Discovered game 'word-gate'"
          curl -fsS http://localhost:8081/games/word-gate/index.html >/dev/null
          curl -fsS http://localhost:8081/games/word-gate/game.js >/dev/null
          ! curl -fsS http://localhost:8081/games/word-gate/authority.js >/dev/null
          ! curl -fsS http://localhost:8081/games/word-gate/words.txt >/dev/null
          ! curl -fsS http://localhost:8081/games/word-gate/words.txt.br >/dev/null

      # The container's /games is mounted READ-ONLY, so this is the only place the real constraint is
      # exercised: the server must expand the package into its own writable cache instead.
      - name: Hot drop-in — a .kbg package installs itself into a read-only games mount
        run: |
          (cd tools/pack-game && npm ci --silent)
          # tictactoe is the only game committed in full (the others are gitignored build output), so
          # package a copy of it under a DIFFERENT id: the plain tictactoe folder is already in the
          # mount from the step above, and a folder deliberately wins a contested id.
          mkdir -p /tmp/pkgsrc && cp -r games/tictactoe/. /tmp/pkgsrc/
          sed -i 's/"id": *"tictactoe"/"id": "packaged-demo"/' /tmp/pkgsrc/GAME.json
          grep -q '"packaged-demo"' /tmp/pkgsrc/GAME.json  # fail loudly if the manifest shape changed
          # --quality 4 keeps CI fast; the format is identical either way.
          node tools/pack-game/pack-game.mjs \
            --in /tmp/pkgsrc --manifest /tmp/pkgsrc/GAME.json \
            --out /tmp/packaged.kbg --version 1.2.3 --quality 4
          cp /tmp/packaged.kbg /tmp/kb-games/
          for i in $(seq 1 45); do
            [ "$(docker inspect -f '{{.State.Running}}' kb 2>/dev/null)" = "true" ] \
              || { echo "Container is not running:"; docker logs kb 2>&1; exit 1; }
            # A distinct marker: "Discovered game" alone would match the plain-folder step above.
            docker logs kb 2>&1 | grep -q "Installed game package 'packaged-demo'" && break
            sleep 1
          done
          docker logs kb 2>&1 | grep "Installed game package 'packaged-demo'"
          # The archive filename is deliberately NOT the id — the manifest id names the folder.
          docker logs kb 2>&1 | grep -q "Installed game package 'packaged-demo'.*1.2.3.*packaged.kbg"
          for i in $(seq 1 30); do
            docker logs kb 2>&1 | grep -q "Discovered game 'packaged-demo'" && break
            sleep 1
          done
          docker logs kb 2>&1 | grep "Discovered game 'packaged-demo'"
          # ...and the extracted game serves from the game origin like any other.
          curl -fsS http://localhost:8081/games/packaged-demo/GAME.json >/dev/null
          curl -fsS http://localhost:8081/games/packaged-demo/index.html >/dev/null
          # The package's Brotli payloads are copied straight into the serving cache, so a br request
          # is served pre-compressed without the server ever re-running max-effort Brotli.
          docker logs kb 2>&1 | grep -q "Seeded .* pre-compressed asset(s) for 'packaged-demo'"
          curl -fsS -H 'Accept-Encoding: br' -D- -o /dev/null \
            http://localhost:8081/games/packaged-demo/index.html | grep -qi '^content-encoding: br'
          # The archive itself must not be downloadable: its contents are public, but handing out a
          # multi-megabyte uncacheable file at a guessable URL is a pointless bandwidth amplifier.
          ! curl -fsS http://localhost:8081/games/packaged.kbg >/dev/null
          ! curl -fsS http://localhost:8080/games/packaged.kbg >/dev/null

      - name: Removing a .kbg uninstalls its game
        run: |
          rm /tmp/kb-games/packaged.kbg
          for i in $(seq 1 45); do
            docker logs kb 2>&1 | grep -q "Uninstalled game 'packaged-demo'" && break
            sleep 1
          done
          docker logs kb 2>&1 | grep "Uninstalled game 'packaged-demo'"
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8081/games/packaged-demo/GAME.json >/dev/null 2>&1 || break
            sleep 1
          done
          ! curl -fsS http://localhost:8081/games/packaged-demo/GAME.json >/dev/null
          # The plain folder dropped in earlier must be untouched by all of this.
          curl -fsS http://localhost:8081/games/tictactoe/index.html >/dev/null

      # The two features meet here: a server-authority game shipped as a package. Its module has to
      # survive the round trip into the unpacked-package cache (the server resolves the module through
      # the catalog's directory, NOT gamesRoot/<id>, or every packaged authority game fails to start)
      # while still never being served.
      - name: A server-authority game ships as a .kbg — installed, playable, module still hidden
        run: |
          mkdir -p /tmp/sasrc && cp -r games/tictactoe-server/. /tmp/sasrc/
          # A distinct id: tictactoe-server is already in the mount as a plain folder from the step
          # above, and a folder deliberately wins a contested id.
          sed -i 's/"id": *"tictactoe-server"/"id": "packaged-authority"/' /tmp/sasrc/GAME.json
          grep -q '"packaged-authority"' /tmp/sasrc/GAME.json  # fail loudly if the manifest changed
          node tools/pack-game/pack-game.mjs \
            --in /tmp/sasrc --manifest /tmp/sasrc/GAME.json \
            --out /tmp/authority.kbg --version 2.0.0 --quality 4
          cp /tmp/authority.kbg /tmp/kb-games/
          for i in $(seq 1 45); do
            [ "$(docker inspect -f '{{.State.Running}}' kb 2>/dev/null)" = "true" ] \
              || { echo "Container is not running:"; docker logs kb 2>&1; exit 1; }
            docker logs kb 2>&1 | grep -q "Installed game package 'packaged-authority'" && break
            sleep 1
          done
          docker logs kb 2>&1 | grep "Installed game package 'packaged-authority'"
          for i in $(seq 1 30); do
            docker logs kb 2>&1 | grep -q "Discovered game 'packaged-authority'" && break
            sleep 1
          done
          # Discovery is the proof the module survived: GameCatalog SKIPS a game whose declared
          # serverAuthority is missing, so a broken extraction would leave the game absent entirely.
          docker logs kb 2>&1 | grep "Discovered game 'packaged-authority'"
          curl -fsS http://localhost:8081/games/packaged-authority/index.html >/dev/null
          curl -fsS http://localhost:8081/games/packaged-authority/game.js >/dev/null
          ! curl -fsS http://localhost:8081/games/packaged-authority/authority.js >/dev/null
          ! curl -fsS http://localhost:8081/games/packaged-authority/authority.js.br >/dev/null

      - name: Shell origin exposes only the thumbnail, never the full game build
        run: |
          # Isolation guarantee: the untrusted build must NOT be reachable on the shell origin (8080),
          # or it could run there and read the identity token. Only the declared thumbnail is allowed.
          curl -fsS http://localhost:8080/games/tictactoe/thumb.svg >/dev/null
          ! curl -fsS http://localhost:8080/games/tictactoe/index.html >/dev/null
          ! curl -fsS http://localhost:8080/games/tictactoe/GAME.json >/dev/null

      - name: Startup logs are sane (no blank-site error, roots resolved, admin origin bound)
        run: |
          docker logs kb 2>&1 | grep -q "Content roots"
          ! docker logs kb 2>&1 | grep -q "has no index.html"
          # The admin origin reports the address Kestrel actually bound. The warning is the signal that a
          # port list somewhere dropped an origin, which is how the portal once shipped unreachable.
          docker logs kb 2>&1 | grep -q "Admin portal listening at"
          ! docker logs kb 2>&1 | grep -q "Admin portal is UNREACHABLE"

      - name: Dump container logs
        if: always()
        run: docker logs kb 2>&1 || true

      - name: Cleanup
        if: always()
        run: docker rm -f kb || true

  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    # Only publish green commits: gate on every test/build job above.
    needs: [dotnet, aot, web, clients-phaser, pack-game, docker]
    # Publish only on main (→ :develop) and v* tags (→ :latest + version tags). Never on PRs or
    # feature branches — those run the suite but produce no image.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    # Serialize publishes for a given ref so two quick main pushes can't race on the :develop tag.
    # cancel-in-progress: false — never abort a push mid-flight; let it finish, then run the next.
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write   # push images to GHCR with the built-in GITHUB_TOKEN — no extra secrets
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute tags from the trigger: main → :develop; a v* tag → :latest + :MAJOR.MINOR.PATCH +
      # :MAJOR.MINOR. metadata-action lowercases the image name (jcub1011/KnockBox-Games →
      # ghcr.io/jcub1011/knockbox-games), and `latest=auto` adds :latest ONLY on semver tag builds.
      # Caveat: latest=auto only sees the current ref, not the registry — pushing an OLDER v* tag
      # would move :latest backward, so push version tags in increasing order.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: latest=auto

      # Reuses the gha cache the `docker` smoke-test job warmed (this job `needs` it), so the
      # pushed image is a cache-hit rebuild of the exact layers that were just smoke-tested — not a
      # fresh, unvalidated build. Single-platform (linux-x64/amd64) matches the Dockerfile's
      # `-r linux-x64` AOT publish — no QEMU/multi-arch needed — and the cache makes the slow AOT
      # compile a no-op on the common path.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: KnockBox.Server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
