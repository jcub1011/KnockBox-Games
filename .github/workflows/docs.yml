name: Docs

# MkDocs Material site for docs/ — in-site search + sidebar/tab navigation.
# Standalone on purpose: it neither calls gate.yml nor touches it, so the
# read-only suite both ci.yml and release.yml rely on is unaffected.
#
# One manual step outside this file: Settings > Pages > Source > GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a PR build never cancels a main deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      # Floating-major pin: newest 9.x today, never a silent jump to 10.
      # Major resolved live against PyPI (9.7.7 on 2026-09-21). When v10 is
      # wanted, bump the range deliberately: "mkdocs-material>=10,<11".
      - name: Install MkDocs Material
        run: pip install "mkdocs-material>=9,<10"
      # --strict turns link warnings into errors, so a PR with a broken
      # ./OTHER-DOC.md link or missing nav entry fails here, not after deploy.
      - name: Build (strict)
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to Pages
    # PRs build only — nothing publishes except main (and manual dispatches).
    if: github.event_name != 'pull_request'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
