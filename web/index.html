<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KnockBox Games</title>
  <link rel="icon" type="image/png" href="/favicons/cat-orange.png" />
  <link rel="stylesheet" href="/home.css" />
</head>
<body>
  <!-- Operator announcement. Fixed toast at the top of the screen, persistent and dismissible: "maintenance in
       20 minutes" stays visible anywhere on the page without causing layout shift. Hidden until one is posted. -->
  <div id="announcement-banner" class="home-announcement" hidden>
    <span class="home-announcement-icon" aria-hidden="true">📣</span>
    <span class="home-announcement-text" id="announcement-text"></span>
    <button type="button" class="home-announcement-close" id="announcement-dismiss"
            aria-label="Dismiss announcement">×</button>
  </div>

  <!-- ── Home view ─────────────────────────────────────────────────────── -->
  <section id="lobby-view" class="home-container">
    <div class="hero-banner">
      <div class="hero-ribbon" aria-hidden="true">
        <div class="hero-ribbon-track">
          <div class="hero-ribbon-tile"></div>
          <div class="hero-ribbon-tile"></div>
        </div>
      </div>
      <div class="hero">
        <h1 class="title">
          <span class="title-letter" aria-hidden="true">K</span>
          <span class="title-letter" aria-hidden="true">N</span>
          <span class="title-letter" aria-hidden="true">O</span>
          <span class="title-letter" aria-hidden="true">C</span>
          <span class="title-letter" aria-hidden="true">K</span>
          <span class="title-letter" aria-hidden="true">B</span>
          <span class="title-letter" aria-hidden="true">O</span>
          <span class="title-letter" aria-hidden="true">X</span>
          <span class="sr-only">KnockBox</span>
        </h1>
      </div>
    </div>
    <p class="hero-tagline">Imagine Jackbox, but worse.</p>

    <form id="join-form" autocomplete="off">
      <div class="join-section">
        <div class="join-card">
          <label class="join-label" for="player-name-input">Player Name</label>
          <input id="player-name-input"
                 placeholder="Enter a name to start playing!"
                 type="text" maxlength="20" name="player-name" />
        </div>

        <div class="join-card">
          <label class="join-label" for="room-code-input">Room Code</label>
          <div class="join-code-row">
            <input id="room-code-input"
                   placeholder="AB12"
                   type="text" maxlength="4" name="room-code"
                   autocapitalize="characters" autocorrect="off" spellcheck="false" />
            <button type="submit" id="join-btn" class="join-btn" disabled>Join</button>
          </div>
        </div>
      </div>
    </form>

    <div class="home-main">
      <div class="games-section">
        <h2 class="games-heading">Host a Game</h2>
        <div class="games-toolbar" id="games-toolbar">
          <div class="games-search-box">
            <span class="games-search-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
              </svg>
            </span>
            <input type="search"
                   id="games-search-input"
                   class="games-search-input"
                   placeholder="Search by name or tag…"
                   aria-label="Search games by name or tag"
                   autocomplete="off"
                   spellcheck="false" />
          </div>
          <div class="games-filters">
            <div class="games-filter-item">
              <label for="games-player-filter" class="games-filter-label">Players</label>
              <select id="games-player-filter" class="games-select" autocomplete="off" aria-label="Filter by player count">
                <option value="">All</option>
                <option value="1">1 Player</option>
                <option value="2">2 Players</option>
                <option value="3">3 Players</option>
                <option value="4">4 Players</option>
                <option value="5">5 Players</option>
                <option value="6">6 Players</option>
                <option value="7">7 Players</option>
                <option value="8">8 Players</option>
                <option value="9+">9+ Players</option>
              </select>
            </div>
            <div class="games-filter-item">
              <label for="games-sort-select" class="games-filter-label">Sort</label>
              <select id="games-sort-select" class="games-select" autocomplete="off" aria-label="Sort games">
                <option value="newest">Newest</option>
                <option value="updated">Recently Updated</option>
                <option value="alphabetical">Alphabetical</option>
              </select>
            </div>
          </div>
        </div>
        <!-- The grid's narration. Deliberately NOT aria-live on #games itself: renderGames rebuilds
             every tile, so a live region there would re-announce the whole catalog on each keystroke. -->
        <p id="games-status" class="sr-only" role="status" aria-live="polite"></p>
        <div id="games" class="game-grid"></div>
      </div>

      <aside class="home-playlog">
        <section class="pl-panel" aria-label="Play Log">
          <div class="pl-header">
            <h2 class="pl-heading">Play Log</h2>
            <button type="button" class="pl-clear" id="playlog-clear" hidden>Clear</button>
          </div>
          <div class="pl-state pl-empty" id="playlog-empty" role="status">
            <span class="pl-state-icon" aria-hidden="true">&#127922;</span>
            <span class="pl-empty-title">No games played yet</span>
            <span class="pl-empty-sub">Your game activity will show up here.</span>
          </div>
          <ul class="pl-list" id="playlog-list" hidden></ul>
        </section>
      </aside>
    </div>
  </section>

  <!-- ── In-game / waiting view ────────────────────────────────────────── -->
  <section id="game-view">
    <div class="game-shell">
      <header class="game-header">
        <a class="game-header-title" id="game-title" href="/"></a>
        <div class="header-actions">
          <button type="button" class="room-code-btn" id="room-code-btn" title="Click to reveal · double-click to enlarge · right-click/long-press to copy · middle-click to join in a new tab">
            <span class="room-code-face room-code-label">Room Code</span>
            <span class="room-code-face room-code-value" id="lobby-code"></span>
          </button>
          <button class="leave-session-btn" id="leave">Leave</button>
        </div>
      </header>
      <div class="game-body">
        <div id="frame-host"></div>
      </div>
    </div>
  </section>

  <!-- ── Room code modal (double-click / mobile-friendly large view) ─────────── -->
  <div class="rc-modal" id="rc-modal" hidden role="dialog" aria-modal="true" aria-labelledby="rc-modal-title">
    <div class="rc-modal-backdrop" data-rc-close></div>
    <div class="rc-modal-card">
      <button type="button" class="rc-modal-close" id="rc-modal-close" aria-label="Close" data-rc-close>×</button>
      <p class="rc-modal-heading" id="rc-modal-title">Room Code</p>
      <p class="rc-modal-code" id="rc-modal-code"></p>
      <div class="rc-modal-actions">
        <button type="button" class="rc-modal-copy" id="rc-modal-copy">Copy code</button>
        <button type="button" class="rc-modal-copy secondary" id="rc-modal-copy-link">Copy Join Link</button>
      </div>
    </div>
  </div>

  <!-- ── Clear Play Log confirmation modal ──────────────────────────────────── -->
  <div class="rc-modal" id="pl-clear-modal" hidden role="dialog" aria-modal="true" aria-labelledby="pl-clear-title">
    <div class="rc-modal-backdrop" data-pl-close></div>
    <div class="rc-modal-card">
      <button type="button" class="rc-modal-close" aria-label="Close" data-pl-close>×</button>
      <p class="rc-modal-heading" id="pl-clear-title">Clear Play Log?</p>
      <p class="pl-clear-text" id="pl-clear-text"></p>
      <div class="rc-modal-actions">
        <button type="button" class="rc-modal-copy secondary" data-pl-close>Cancel</button>
        <button type="button" class="rc-modal-copy" id="pl-clear-confirm">Clear All</button>
      </div>
    </div>
  </div>

  <!-- ── Game launch overlay (covers click → game document loaded) ───────────── -->
  <!-- Fixed to the viewport, so it lives OUTSIDE #game-view: the click happens while that section
       is still display:none. role="status" (not dialog) — it must never trap focus.
       #launch-tile is the clicked game tile continuing its journey: shell.js flies it here from the
       tile's own grid position, so nothing large ever arrives on screen. -->
  <div class="launch-overlay" id="launch-overlay" hidden role="status" aria-live="polite">
    <div class="launch-stage">
      <div class="launch-tile" id="launch-tile" hidden>
        <img class="launch-art" id="launch-art" alt="" draggable="false" />
      </div>
      <div class="launch-status">
        <div class="launch-dots" aria-hidden="true"><span></span><span></span><span></span></div>
        <p class="launch-title" id="launch-title">Starting game…</p>
        <button type="button" class="launch-cancel" id="launch-cancel">Back to games</button>
        <p class="launch-hint" id="launch-hint" hidden>Still going — a big game can take a while the first time.</p>
      </div>
    </div>
  </div>

  <span id="conn" hidden>connecting…</span>

  <script type="module">import { bootstrap } from '/shell.js?v=18'; bootstrap();</script>
</body>
</html>
